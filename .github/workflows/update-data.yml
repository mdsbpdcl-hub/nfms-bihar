name: Update NFMS data

on:
  schedule:
    - cron: '41 16 * * *'   # 22:11 IST daily (NFMS hours-of-supply figures settle after 21:30)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    # Set the repository variable NFMS_RUNNER to "self-hosted" to run on a computer in India
    runs-on: ${{ vars.NFMS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          pip install pdfplumber

      - name: Collect state and DISCOM figures
        run: node scripts/collect.mjs

      - name: Collect major-city reports
        continue-on-error: true
        run: python scripts/cities.py

      - name: Commit if changed
        run: |
          git config user.name "nfms-bot"
          git config user.email "nfms-bot@users.noreply.github.com"
          git add data/latest.json data/latest.csv data/history.csv data/cities.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Data: NFMS snapshot $(TZ=Asia/Kolkata date +%F)"
            git push
          fi
